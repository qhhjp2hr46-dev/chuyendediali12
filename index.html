<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Face Recognition</title>

  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

  <style>

    body{
      margin:0;
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
    }

    h1{
      margin-top:20px;
    }

    .video-box{
      position:relative;
      width:720px;
      margin:auto;
    }

    video{
      border-radius:10px;
      border:4px solid white;
    }

    canvas{
      position:absolute;
      left:0;
      top:0;
    }

  </style>

</head>

<body>

<h1>ỨNG DỤNG NHẬN DIỆN KHUÔN MẶT</h1>

<div class="video-box">

  <video id="video"
         width="720"
         height="560"
         autoplay
         muted>
  </video>

</div>

<script>

const video = document.getElementById('video');


// Mở camera
navigator.mediaDevices.getUserMedia({
  video:true
})
.then(stream => {
  video.srcObject = stream;
});


// Load AI Model
Promise.all([

  faceapi.nets.tinyFaceDetector.loadFromUri(
    'https://justadudewhohacks.github.io/face-api.js/models'
  )

]).then(startVideo);


// Bắt đầu nhận diện
function startVideo(){

  video.addEventListener('play', () => {

    const canvas =
      faceapi.createCanvasFromMedia(video);

    document
      .querySelector('.video-box')
      .append(canvas);

    const displaySize = {
      width:video.width,
      height:video.height
    };

    faceapi.matchDimensions(
      canvas,
      displaySize
    );

    setInterval(async () => {

      const detections =
        await faceapi.detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions()
        );

      const resizedDetections =
        faceapi.resizeResults(
          detections,
          displaySize
        );

      canvas.getContext('2d')
      .clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      faceapi.draw.drawDetections(
        canvas,
        resizedDetections
      );

    },100);

  });

}

</script>

</body>
</html>
